name: Bug report
description: Report incorrect behavior in the Fuse CLI, hooks or MCP server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what did Fuse do instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fuse version
      description: Output of `fuse --version`
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        Commands, the hook or MCP call, or a minimal repository layout. If the engine or a hook is involved,
        attach the lines of `engine.log` or `hook.log` around the failure. Both are in the repository's state
        directory: `%LOCALAPPDATA%\fuse\repos\<id>` on Windows, `~/.local/share/fuse/repos/<id>` (or
        `$XDG_DATA_HOME/fuse/repos/<id>` when that is set) on Linux, and `~/Library/Application Support/fuse/repos/<id>`
        on macOS.
        [Where the logs are](https://fuse.codes/docs/troubleshooting#where-the-logs-are)
        shows how to find `<id>`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Hooks
        - MCP server
        - Documentation
        - Other
    validations:
      required: true
