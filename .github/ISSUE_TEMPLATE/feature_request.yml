name: Feature request
description: Suggest an improvement to Fuse
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard with Fuse, or without it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Fuse do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Check (fuse check)
        - Test selection and runs (fuse test)
        - Build (fuse build)
        - Hooks and harnesses (fuse init, fuse hook)
        - MCP server (fuse mcp)
        - Documentation
        - Other
    validations:
      required: true
