name: CI

# This workflow never runs more than 20 jobs at once: the build and format gate runs first, then the test
# matrix peaks at 18 (6 shards on 3 operating systems, capped by max-parallel below) alongside 1 net11-compat job
# (19 concurrent jobs total), and Package runs after the tests. The smoke workflow (.github/workflows/smoke.yml,
# 4 jobs) and the evals are separate workflows; no workflow passes the repository's 20 concurrent jobs on its own.

on:
  push:
    branches: [main]
  pull_request:
  # A targeted run: only the test classes or namespaces a change touches, on the operating systems named, so one
  # failure is checked again in minutes instead of rerunning every shard. Start it with
  # gh workflow run ci.yml --ref <branch> -f filter="--filter-class Fuse.Tests.Engine.CheckerTests" -f os='["ubuntu-latest"]'
  workflow_dispatch:
    inputs:
      filter:
        description: Test platform filter arguments, such as --filter-class Fuse.Tests.Engine.CheckerTests (repeatable) or --filter-method "*Name".
        required: true
      os:
        description: Operating systems as a JSON array.
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        required: true
      sdk:
        description: Optional additional .NET SDK version to install alongside global.json, such as 11.0.x.
        default: ''
        required: false

permissions:
  contents: read

jobs:
  # The tests run in shards on each OS, because most of their time goes to generating and restoring fixture
  # repositories. Each shard names test classes with the test platform's filters, and the last one runs
  # every test the others do not, so a test in a new class or namespace still runs. The real-build contention
  # tests are isolated together, and the heaviest lock tests run on their own. A test class no shard names
  # runs in the last shard, so adding test classes never adds a shard or a job.
  test:
    name: Test ${{ matrix.shard.name }} (${{ matrix.os }})
    needs: [format]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard:
          - name: e2e-locks
            filter: --filter-class Fuse.Tests.EndToEnd.BuildLockTests --filter-class Fuse.Tests.Unit.DagBuildLockTests --filter-class Fuse.Tests.Unit.SwarmCliOperationsTests
          - name: e2e-builds
            filter: --filter-class Fuse.Tests.EndToEnd.PlanRunTests --filter-class Fuse.Tests.EndToEnd.AnalyzerLockTests --filter-class Fuse.Tests.EndToEnd.BuildOutputTests --filter-class Fuse.Tests.Engine.TestAccelerationTests --filter-class Fuse.Tests.Unit.SliceTestCacheTests
          - name: e2e-checks
            filter: --filter-class Fuse.Tests.EndToEnd.EngineProcessTests --filter-class Fuse.Tests.EndToEnd.NonAsciiPathTests --filter-class Fuse.Tests.Engine.HypervisorMemoryTests --filter-class Fuse.Tests.Unit.BlueprintTests
          - name: engine-heavy
            filter: --filter-class Fuse.Tests.Engine.CheckerTests --filter-class Fuse.Tests.Engine.RequestRouterTests --filter-class Fuse.Tests.Engine.RepairPacketTests
          - name: engine-selection
            filter: --filter-class Fuse.Tests.Engine.TestSelectionTests --filter-class Fuse.Tests.Engine.SessionAttributionTests --filter-class Fuse.Tests.Engine.CauseLinesTests --filter-class Fuse.Tests.Engine.ShadowPreparationTests --filter-class Fuse.Tests.Engine.PhaseTimingTests --filter-class Fuse.Tests.Engine.EngineClientTests --filter-class Fuse.Tests.Engine.ChangeReachTests --filter-class Fuse.Tests.Engine.ReusedErrorsTests --filter-class Fuse.Tests.Engine.SyntaxIndexAndSpeedTests
          - name: rest
            filter: >-
              --filter-not-class Fuse.Tests.EndToEnd.BuildLockTests --filter-not-class Fuse.Tests.Unit.DagBuildLockTests --filter-not-class Fuse.Tests.Unit.SwarmCliOperationsTests
              --filter-not-class Fuse.Tests.EndToEnd.PlanRunTests --filter-not-class Fuse.Tests.EndToEnd.AnalyzerLockTests
              --filter-not-class Fuse.Tests.EndToEnd.BuildOutputTests --filter-not-class Fuse.Tests.Engine.TestAccelerationTests --filter-not-class Fuse.Tests.Unit.SliceTestCacheTests
              --filter-not-class Fuse.Tests.EndToEnd.EngineProcessTests --filter-not-class Fuse.Tests.EndToEnd.NonAsciiPathTests
              --filter-not-class Fuse.Tests.Engine.HypervisorMemoryTests --filter-not-class Fuse.Tests.Unit.BlueprintTests
              --filter-not-class Fuse.Tests.Engine.CheckerTests --filter-not-class Fuse.Tests.Engine.RequestRouterTests --filter-not-class Fuse.Tests.Engine.RepairPacketTests
              --filter-not-class Fuse.Tests.Engine.TestSelectionTests --filter-not-class Fuse.Tests.Engine.SessionAttributionTests
              --filter-not-class Fuse.Tests.Engine.CauseLinesTests --filter-not-class Fuse.Tests.Engine.ShadowPreparationTests
              --filter-not-class Fuse.Tests.Engine.PhaseTimingTests --filter-not-class Fuse.Tests.Engine.EngineClientTests
              --filter-not-class Fuse.Tests.Engine.ChangeReachTests --filter-not-class Fuse.Tests.Engine.ReusedErrorsTests
              --filter-not-class Fuse.Tests.Engine.SyntaxIndexAndSpeedTests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Git identity for fixture repositories
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"

      - name: Build
        run: dotnet build Fuse.slnx -c Release

      - name: Test
        shell: bash
        run: dotnet test --solution Fuse.slnx -c Release --no-build --hangdump --hangdump-timeout 20m ${{ matrix.shard.filter }}

      - name: Tests still running at a hang
        if: failure()
        shell: bash
        run: cat TestResults/*_hang.log 2>/dev/null || true

  net11-compat:
    name: Validate .NET 11 SDK compatibility (ubuntu-latest)
    needs: [format]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install .NET 11 SDK
        id: setup-net11
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Git identity for fixture repositories
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"

      - name: Build and verify .NET 11 compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet --list-sdks | grep -q '^11\.'; then
            echo "::notice::.NET 11 SDK is not available on this runner; skipping .NET 11 compatibility checks."
            exit 0
          fi

          dotnet build Fuse.slnx -c Release
          dotnet test --solution Fuse.slnx -c Release --no-build --hangdump --hangdump-timeout 15m \
            --filter-class Fuse.Tests.Unit.GlobalJsonTests \
            --filter-class Fuse.Tests.Architecture.NamespaceDependencyTests \
            --filter-class Fuse.Tests.EndToEnd.EngineProcessTests

          fuse_bin="$PWD/src/Fuse/bin/Release/net10.0/fuse"
          net11_repo=$(mktemp -d)
          trap 'rm -rf "$net11_repo"' EXIT
          cd "$net11_repo"
          git init -q
          printf '{ "sdk": { "version": "11.0.100", "rollForward": "latestMajor" } }\n' > global.json
          dotnet new sln -n Net11Compat >/dev/null
          dotnet new classlib -n Lib -o Lib -f net11.0 >/dev/null
          dotnet new xunit -n Tests -o Tests -f net11.0 >/dev/null
          sln_file=$(echo Net11Compat.sln*)
          dotnet sln "$sln_file" add Lib/Lib.csproj Tests/Tests.csproj >/dev/null
          dotnet add Tests/Tests.csproj reference Lib/Lib.csproj >/dev/null
          printf 'namespace Lib;\n\npublic static class Math11\n{\n    public static int Twice(int x) => x * 2;\n}\n' > Lib/Class1.cs
          printf 'using Lib;\n\npublic class Math11Tests\n{\n    [Fact]\n    public void Twice_works() => Assert.Equal(6, Math11.Twice(3));\n}\n' > Tests/UnitTest1.cs
          printf 'bin/\nobj/\n' > .gitignore
          git add -A && git commit -qm init
          dotnet restore "$sln_file" >/dev/null

          "$fuse_bin" check
          printf 'namespace Lib;\n\npublic static class Math11\n{\n    public static int Twice(int x) => x + x;\n}\n' > Lib/Class1.cs
          "$fuse_bin" check
          "$fuse_bin" test
          "$fuse_bin" build
          "$fuse_bin" stop

  targeted:
    name: Test ${{ inputs.filter }} (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install additional .NET SDK
        if: inputs.sdk != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.sdk }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Git identity for fixture repositories
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"

      - name: Build
        run: dotnet build Fuse.slnx -c Release

      - name: Test
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
        # The filter splits into its arguments on purpose.
        run: dotnet test --solution Fuse.slnx -c Release --no-build --hangdump --hangdump-timeout 20m $FILTER

      - name: Tests still running at a hang
        if: failure()
        shell: bash
        run: cat TestResults/*_hang.log 2>/dev/null || true

  # The gate builds once and checks formatting before any shard starts, so a compile or format error fails in
  # minutes instead of failing all 18 test jobs.
  format:
    name: Build and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Fuse.slnx -c Release

      - name: Format
        run: dotnet format Fuse.slnx --verify-no-changes --no-restore

      # On a format failure, the fix as a patch, so it applies with git apply without running dotnet format locally.
      - name: Format patch
        if: failure()
        run: |
          dotnet format Fuse.slnx --no-restore || true
          git diff > format.patch

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: format-patch
          path: format.patch

  # Package runs after the tests, so the run never exceeds 20 concurrent jobs: 6 shards on 3 OS plus Format
  # is 19 while the tests run, then the package jobs run on their own. It still runs when the tests fail, so a
  # broken build keeps its packaging signal; only a cancelled run skips it.
  package:
    name: Package
    needs: [test]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/package.yml
