name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests run in shards on each OS, because most of their time goes to generating and restoring fixture
  # repositories. Each shard names test classes or namespaces with the test platform's filters, and the last one runs
  # every test the others do not, so a test in a new class or namespace still runs.
  test:
    name: Test ${{ matrix.shard.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard:
          - name: checker
            filter: --filter-class Fuse.Tests.Engine.CheckerTests --filter-class Fuse.Tests.Engine.CauseLinesTests
          - name: selection
            filter: --filter-class Fuse.Tests.Engine.TestSelectionTests --filter-class Fuse.Tests.Engine.ShadowPreparationTests --filter-class Fuse.Tests.Engine.PhaseTimingTests --filter-class Fuse.Tests.Engine.EngineClientTests
          - name: router
            filter: --filter-class Fuse.Tests.Engine.RequestRouterTests --filter-class Fuse.Tests.Engine.SessionAttributionTests --filter-class Fuse.Tests.Engine.ReusedErrorsTests --filter-class Fuse.Tests.Engine.ChangeReachTests
          - name: processes
            filter: --filter-namespace Fuse.Tests.EndToEnd
          - name: rest
            filter: >-
              --filter-not-namespace Fuse.Tests.EndToEnd
              --filter-not-class Fuse.Tests.Engine.CheckerTests --filter-not-class Fuse.Tests.Engine.CauseLinesTests
              --filter-not-class Fuse.Tests.Engine.TestSelectionTests --filter-not-class Fuse.Tests.Engine.ShadowPreparationTests
              --filter-not-class Fuse.Tests.Engine.PhaseTimingTests --filter-not-class Fuse.Tests.Engine.EngineClientTests
              --filter-not-class Fuse.Tests.Engine.RequestRouterTests --filter-not-class Fuse.Tests.Engine.SessionAttributionTests
              --filter-not-class Fuse.Tests.Engine.ReusedErrorsTests --filter-not-class Fuse.Tests.Engine.ChangeReachTests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Git identity for fixture repositories
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"

      - name: Build
        run: dotnet build Fuse.slnx -c Release

      - name: Test
        shell: bash
        run: dotnet test --solution Fuse.slnx -c Release --no-build ${{ matrix.shard.filter }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Format
        run: dotnet format Fuse.slnx --verify-no-changes

  package:
    name: Package
    uses: ./.github/workflows/package.yml
