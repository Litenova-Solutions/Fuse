name: Evals

# Runs the eval suites on GitHub-hosted runners. Adding the evals label to a pull request runs the latency suite, which
# every change to a request's path needs; starting the workflow from the Actions tab chooses the repositories and the
# suites, all three by default.
#
# One build job compiles Fuse once, so every job measures the same build. The latency suite runs in two jobs per
# repository: one runs the checks and the test rounds with the native client, the fuse command a release installs on
# win-x64, then the checks alone again with the managed client on the same VM; the other runs the multi-agent scenario.
# A merge job puts the multi-agent result into the first job's file. The correctness and selection suites run in two stages per repository. The truth jobs
# run the real dotnet build or dotnet test for HEAD and for each case, split into shards; the truth does not change while
# the repository's tree, the seed, the SDK and the eval code stay the same, so it is kept in the Actions cache and a later
# run skips those jobs. The measure job then runs Fuse alone on a fresh VM against the merged truth, and saves it to the
# cache. Each VM runs nothing else, so no other work skews the times.
#
# Each measure job and each latency merge job uploads evals-<repo>-<suite>: results/ holds the file to commit to evals/results,
# managed/ the managed client's latency file for evals/results/managed, truth/ the merged truth, and runner.txt
# describes the runner. Each truth job uploads its shard and its runner.txt.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      repos:
        description: Repositories to measure, as a JSON array (FluentValidation, NodaTime, Jellyfin, CommunityToolkit, or fixture for the generated solution).
        default: '["FluentValidation", "NodaTime", "Jellyfin", "CommunityToolkit"]'
        required: true
      suites:
        description: Suites to run, as a JSON array (correctness, selection, latency).
        default: '["correctness", "selection", "latency"]'
        required: true
      fresh-truth:
        description: Ignore the cached truth and run the real dotnet build and dotnet test again, as after a flaky test.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  EVALS: dotnet evals/Fuse.Evals/bin/Release/net10.0/Fuse.Evals.dll

jobs:
  plan:
    name: Plan the jobs
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'evals'
    runs-on: ubuntu-latest
    outputs:
      latency: ${{ steps.matrix.outputs.latency }}
      truth: ${{ steps.matrix.outputs.truth }}
      measure: ${{ steps.matrix.outputs.measure }}
    steps:
      - id: matrix
        shell: python
        env:
          REPOS: ${{ inputs.repos || '["FluentValidation", "NodaTime", "Jellyfin", "CommunityToolkit"]' }}
          SUITES: ${{ inputs.suites || '["latency"]' }}
        run: |
          import json, os
          repos = json.loads(os.environ["REPOS"])
          suites = json.loads(os.environ["SUITES"])
          # Truth shards per repository, from the 5.2.0 run's dotnet times: a selection case on the Community Toolkit
          # takes about 15 minutes of dotnet test and HEAD's full run as long, so HEAD gets a shard of its own there.
          shards = {
              "correctness": {"fixture": 1, "FluentValidation": 1, "NodaTime": 1, "Jellyfin": 2, "CommunityToolkit": 2},
              "selection": {"fixture": 1, "FluentValidation": 1, "NodaTime": 2, "Jellyfin": 4, "CommunityToolkit": 6},
          }
          staged = [s for s in ("correctness", "selection") if s in suites]
          latency = [r for r in repos] if "latency" in suites else []
          measure = [{"suite": s, "repo": r} for s in staged for r in repos]
          truth = [{"suite": s, "repo": r, "shard": k, "shards": shards[s].get(r, 1)} for s in staged for r in repos for k in range(shards[s].get(r, 1))]
          # Jobs start in matrix order when the runners are all busy, so the longest shards go first: selection before
          # correctness, the largest repositories first, and HEAD's shard first within a repository.
          order = {"CommunityToolkit": 0, "Jellyfin": 1, "NodaTime": 2, "FluentValidation": 3, "fixture": 4}
          truth.sort(key=lambda t: (t["suite"] != "selection", order.get(t["repo"], 4), t["shard"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for name, value in (("latency", latency), ("truth", truth), ("measure", measure)):
                  out.write(f"{name}={json.dumps(value)}\n")
                  print(f"{name}: {json.dumps(value)}")

  build:
    name: Build Fuse
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Fuse.slnx -c Release
      - name: Publish the native client
        run: dotnet publish src/Fuse/Fuse.csproj -c Release -r win-x64 -o artifacts/native
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            src/Fuse/bin/Release/
            evals/Fuse.Evals/bin/Release/
            artifacts/native/
          if-no-files-found: error
          retention-days: 3

  latency:
    name: latency (${{ matrix.part }}) on ${{ matrix.repo }}
    needs: [plan, build]
    if: needs.plan.outputs.latency != '[]'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.latency) }}
        part: [main, agents]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The pinned repositories test on .NET 8 and 9 as well; global.json adds the SDK that builds Fuse.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build
      - &identity
        name: Git identity for the generated fixture
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"
      - &packages
        name: NuGet packages of the pinned repository
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.repo }}-${{ hashFiles('evals/Fuse.Evals/PinnedRepo.cs', 'evals/Fuse.Evals/FixtureGenerator.cs') }}
      - &clone
        name: Clone the pinned repository
        if: matrix.repo != 'fixture'
        run: $EVALS clone "${{ matrix.repo }}"
      - name: Run latency (${{ matrix.part }}) with the native client
        run: |
          $EVALS latency "${{ matrix.repo }}" --part ${{ matrix.part }} --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")"
          mkdir -p out/results
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
      - name: Run the checks with the managed client
        if: matrix.part == 'main'
        run: |
          $EVALS latency "${{ matrix.repo }}" --part checks --fuse "$(cygpath -w "$PWD/src/Fuse/bin/Release/net10.0/fuse.exe")"
          mkdir -p out/managed
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/managed/
      - &runner
        name: Describe the runner
        if: always()
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $cores = (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum
          $memory = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          New-Item -ItemType Directory -Force out | Out-Null
          "runner: $env:ImageOS $env:ImageVersion`ncpu: $cpu, $cores logical processors`nmemory: $memory GB`nsdk: $(dotnet --version)`ncommit: $env:GITHUB_SHA" | Set-Content out/runner.txt
          Get-Content out/runner.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-${{ matrix.part }}-${{ matrix.repo }}
          path: out/
          if-no-files-found: error

  latency-merge:
    name: merge latency on ${{ matrix.repo }}
    needs: [plan, latency]
    if: ${{ !cancelled() && needs.plan.outputs.latency != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.latency) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: latency-main-${{ matrix.repo }}
          path: main
      - uses: actions/download-artifact@v4
        with:
          name: latency-agents-${{ matrix.repo }}
          path: agents
      - name: Put the multi-agent result into the latency file
        shell: python
        run: |
          import glob, json, os, shutil
          main_file = glob.glob("main/results/*.json")[0]
          main = json.load(open(main_file))
          agents = json.load(open(glob.glob("agents/results/*.json")[0]))
          if agents["fuseBuild"] != main["fuseBuild"] or agents["commit"] != main["commit"]:
              raise SystemExit("the two latency parts measured different builds or commits")
          main["part"] = "all"
          main["multiAgent"] = agents["multiAgent"]
          os.makedirs("out/results")
          with open(os.path.join("out/results", os.path.basename(main_file)), "w") as f:
              json.dump(main, f, indent=2)
          shutil.copytree("main/managed", "out/managed")
          shutil.copy("main/runner.txt", "out/runner.txt")
          shutil.copy("agents/runner.txt", "out/runner-agents.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: evals-${{ matrix.repo }}-latency
          path: out/
          if-no-files-found: error

  truth:
    name: truth of ${{ matrix.suite }} on ${{ matrix.repo }} (${{ matrix.shard }}/${{ matrix.shards }})
    needs: [plan, build]
    if: needs.plan.outputs.truth != '[]'
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.truth) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The pinned repositories test on .NET 8 and 9 as well; global.json adds the SDK that builds Fuse.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build
      - *identity
      - *packages
      - *clone
      - &key
        name: Truth key
        id: key
        run: echo "key=$($EVALS key "${{ matrix.suite }}" "${{ matrix.repo }}" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Look for the cached truth
        id: cached
        if: ${{ !inputs.fresh-truth }}
        uses: actions/cache/restore@v4
        with:
          path: truth.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Run shard ${{ matrix.shard }} of the truth
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          $EVALS truth "${{ matrix.suite }}" "${{ matrix.repo }}" --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --out out/truth-${{ matrix.shard }}.json
      - *runner
      - uses: actions/upload-artifact@v4
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          name: truth-${{ matrix.suite }}-${{ matrix.repo }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  measure:
    name: ${{ matrix.suite }} on ${{ matrix.repo }}
    needs: [plan, build, truth]
    # A failed truth shard leaves its cases to this job, which runs what the merged truth lacks.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.measure != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.measure) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The pinned repositories test on .NET 8 and 9 as well; global.json adds the SDK that builds Fuse.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build
      - *identity
      - *packages
      - *clone
      - *key
      - name: Restore the cached truth
        id: cached
        if: ${{ !inputs.fresh-truth }}
        uses: actions/cache/restore@v4
        with:
          path: truth.json
          key: ${{ steps.key.outputs.key }}
      - name: Download the truth shards
        # None exist when the truth came from the cache.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: truth-${{ matrix.suite }}-${{ matrix.repo }}-*
          path: shards
      - name: Run ${{ matrix.suite }} with the native client
        run: |
          mkdir -p shards out/results out/truth
          $EVALS "${{ matrix.suite }}" "${{ matrix.repo }}" --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")" --cache truth.json --truth-dir shards --cache-out out/truth/truth.json
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
          cp out/truth/truth.json truth.json
      - name: Save the truth
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: truth.json
          key: ${{ steps.key.outputs.key }}
      - *runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-${{ matrix.repo }}-${{ matrix.suite }}
          path: out/
          if-no-files-found: error
