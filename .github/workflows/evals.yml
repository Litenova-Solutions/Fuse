name: Evals

# Runs the eval suites on GitHub-hosted runners. Adding the evals label to a pull request runs the latency suite, which
# every change to a request's path needs; starting the workflow from the Actions tab chooses the repositories and the
# suites, all three by default.
#
# One build job compiles Fuse once, so every job measures the same build. The latency suite runs in two jobs per
# repository: one runs the checks and the test rounds with the native client, the fuse command a release installs on
# win-x64, then the checks alone again with the managed client on the same VM; the other runs the multi-agent scenario.
# A merge job puts the multi-agent result into the first job's file.
#
# The correctness and selection suites run in evals-suite.yml, called once per suite and repository: truth jobs split
# into shards, then a measure job. Each call waits only for its own truth, so a small repository's results do not wait
# for the Community Toolkit's truth. The truth does not change while the repository's tree, the seed, the SDK and the eval
# code stay the same, so it is kept in the Actions cache and a later run skips those jobs.
#
# Each measure job and each latency merge job uploads evals-<repo>-<suite>: results/ holds the file to commit to evals/results,
# managed/ the managed client's latency file for evals/results/managed, truth/ the merged truth, and runner.txt
# describes the runner. Each truth job uploads its shard and its runner.txt.
#
# The attribution suite is the light one: one job per repository checks two writers whose breaking changes reach each
# other through the post-edit hook, without and with sessions, and uploads evals-<repo>-attribution. It needs no truth
# and runs no tests, so it is not in the default set; ask for it in the suites input.
#
# The analyzers suite is lighter still: one job generates a small repository whose analyzer reads the whole project at
# error severity, measures the post-edit hook, checks of one and twenty files and the engine's memory, and uploads
# evals-analyzer-fixture-analyzers. The evals label runs it with the latency suite.
#
# The scale suite is check-only on a generated large tree: one job generates thousands of files, changes a quarter of
# them, and measures one cold check and the engine's memory, uploading evals-scale-fixture-scale. Like attribution, it
# runs only when the suites input names it.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      repos:
        description: Repositories to measure, as a JSON array (FluentValidation, NodaTime, Jellyfin, Polly, or fixture for the generated solution).
        default: '["FluentValidation", "NodaTime", "Jellyfin", "Polly"]'
        required: true
      suites:
        description: Suites to run, as a JSON array (correctness, selection, latency, attribution, analyzers, scale).
        default: '["correctness", "selection", "latency"]'
        required: true
      fresh-truth:
        description: Ignore the cached truth and run the real dotnet build and dotnet test again, as after a flaky test.
        type: boolean
        default: false
      latency_parts:
        description: Latency parts to run, as a JSON array (main, agents). One part alone skips the merge, for a quicker look at one scenario.
        default: '["main", "agents"]'
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  EVALS: dotnet evals/Fuse.Evals/bin/Release/net10.0/Fuse.Evals.dll

jobs:
  plan:
    name: Plan the jobs
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'evals'
    runs-on: ubuntu-latest
    outputs:
      latency: ${{ steps.matrix.outputs.latency }}
      attribution: ${{ steps.matrix.outputs.attribution }}
      analyzers: ${{ steps.matrix.outputs.analyzers }}
      scale: ${{ steps.matrix.outputs.scale }}
      measure: ${{ steps.matrix.outputs.measure }}
    steps:
      - id: matrix
        shell: python
        env:
          REPOS: ${{ inputs.repos || '["FluentValidation", "NodaTime", "Jellyfin", "Polly"]' }}
          SUITES: ${{ inputs.suites || '["latency", "analyzers"]' }}
        run: |
          import json, os
          repos = json.loads(os.environ["REPOS"])
          suites = json.loads(os.environ["SUITES"])
          # Truth shards per repository, from the 5.4.0 run's dotnet times; Polly's are a first estimate, to rebalance
          # from its first run's truth job times. A Jellyfin case takes about 4 minutes and HEAD 14, so its shards hold two cases each. A
          # correctness case is one build, so its shards hold about eight cases on the larger repositories.
          shards = {
              "correctness": {"fixture": 1, "FluentValidation": 1, "NodaTime": 2, "Jellyfin": 4, "Polly": 2},
              "selection": {"fixture": 1, "FluentValidation": 1, "NodaTime": 4, "Jellyfin": 6, "Polly": 4},
          }
          staged = [s for s in ("correctness", "selection") if s in suites]
          latency = [r for r in repos] if "latency" in suites else []
          attribution = [r for r in repos] if "attribution" in suites else []
          analyzers = "analyzers" in suites
          scale = "scale" in suites
          # One call of evals-suite.yml per suite and repository, so a repository's measure job waits only for its own
          # truth. Jobs start in matrix order when the runners are all busy, so the longest go first: selection before
          # correctness, and the largest repositories first.
          order = {"Jellyfin": 0, "NodaTime": 1, "Polly": 2, "FluentValidation": 3, "fixture": 4}
          measure = [{"suite": s, "repo": r, "shards": shards[s].get(r, 1), "shard_list": json.dumps(list(range(shards[s].get(r, 1))))} for s in staged for r in repos]
          measure.sort(key=lambda m: (m["suite"] != "selection", order.get(m["repo"], 4)))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"analyzers={str(analyzers).lower()}\n")
              out.write(f"scale={str(scale).lower()}\n")
              for name, value in (("latency", latency), ("attribution", attribution), ("measure", measure)):
                  out.write(f"{name}={json.dumps(value)}\n")
                  print(f"{name}: {json.dumps(value)}")

  build:
    name: Build Fuse
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Fuse.slnx -c Release
      - name: Publish the native client
        run: dotnet publish src/Fuse/Fuse.csproj -c Release -r win-x64 -o artifacts/native
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            src/Fuse/bin/Release/
            evals/Fuse.Evals/bin/Release/
            artifacts/native/
          if-no-files-found: error
          retention-days: 3

  latency:
    name: latency (${{ matrix.part }}) on ${{ matrix.repo }}
    needs: [plan, build]
    if: needs.plan.outputs.latency != '[]'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.latency) }}
        part: ${{ fromJSON(inputs.latency_parts || '["main", "agents"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The pinned repositories test on .NET 8 and 9 as well; global.json adds the SDK that builds Fuse.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: build
      - &identity
        name: Git identity for the generated fixture
        run: |
          git config --global user.email "ci@fuse.invalid"
          git config --global user.name "Fuse CI"
      - &packages
        name: NuGet packages of the pinned repository
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.repo }}-${{ hashFiles('evals/Fuse.Evals/PinnedRepo.cs', 'evals/Fuse.Evals/FixtureGenerator.cs') }}
      - &clone
        name: Clone the pinned repository
        if: matrix.repo != 'fixture'
        run: $EVALS clone "${{ matrix.repo }}"
      - name: Run latency (${{ matrix.part }}) with the native client
        run: |
          $EVALS latency "${{ matrix.repo }}" --part ${{ matrix.part }} --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")"
          mkdir -p out/results
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
      - name: Run the checks with the managed client
        if: matrix.part == 'main'
        run: |
          $EVALS latency "${{ matrix.repo }}" --part checks --fuse "$(cygpath -w "$PWD/src/Fuse/bin/Release/net10.0/fuse.exe")"
          mkdir -p out/managed
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/managed/
      - &runner
        name: Describe the runner
        if: always()
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $cores = (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum
          $memory = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          New-Item -ItemType Directory -Force out | Out-Null
          "runner: $env:ImageOS $env:ImageVersion`ncpu: $cpu, $cores logical processors`nmemory: $memory GB`nsdk: $(dotnet --version)`ncommit: $env:GITHUB_SHA" | Set-Content out/runner.txt
          Get-Content out/runner.txt
      - name: Keep the engine logs
        if: always()
        # The engine log and hook log of every repository the run used, so a failed or slow scenario can be read
        # without running it again.
        run: |
          mkdir -p out/engine-logs
          for d in "$(cygpath -u "$LOCALAPPDATA")"/fuse/repos/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d"); mkdir -p "out/engine-logs/$n"
            cp "$d"engine.log "$d"hook.log "$d"root "out/engine-logs/$n/" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latency-${{ matrix.part }}-${{ matrix.repo }}
          path: out/
          if-no-files-found: error

  attribution:
    name: attribution on ${{ matrix.repo }}
    needs: [plan, build]
    if: needs.plan.outputs.attribution != '[]'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.attribution) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The pinned repositories test on .NET 8 and 9 as well; global.json adds the SDK that builds Fuse.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: build
      - *identity
      - *packages
      - *clone
      - name: Run attribution with the native client
        run: |
          $EVALS attribution "${{ matrix.repo }}" --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")"
          mkdir -p out/results
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
      - *runner
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-${{ matrix.repo }}-attribution
          path: out/
          if-no-files-found: error

  analyzers:
    name: analyzers on the analyzer fixture
    needs: [plan, build]
    if: needs.plan.outputs.analyzers == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: build
      - *identity
      - name: Run analyzers with the native client
        run: |
          $EVALS analyzers analyzer-fixture --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")"
          mkdir -p out/results
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
      - *runner
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-analyzer-fixture-analyzers
          path: out/
          if-no-files-found: error

  scale:
    name: scale on the scale fixture
    needs: [plan, build]
    if: needs.plan.outputs.scale == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: build
      - *identity
      - name: Run scale with the native client
        run: |
          $EVALS scale scale-fixture --fuse "$(cygpath -w "$PWD/artifacts/native/fuse.exe")"
          mkdir -p out/results
          git ls-files --others --exclude-standard evals/results | xargs -I{} mv {} out/results/
      - *runner
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-scale-fixture-scale
          path: out/
          if-no-files-found: error

  latency-merge:
    name: merge latency on ${{ matrix.repo }}
    needs: [plan, latency]
    if: ${{ !cancelled() && needs.plan.outputs.latency != '[]' && (!inputs.latency_parts || (contains(inputs.latency_parts, 'main') && contains(inputs.latency_parts, 'agents'))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.latency) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: latency-main-${{ matrix.repo }}
          path: main
      - uses: actions/download-artifact@v8
        with:
          name: latency-agents-${{ matrix.repo }}
          path: agents
      - name: Put the multi-agent result into the latency file
        shell: python
        run: |
          import glob, json, os, shutil
          main_file = glob.glob("main/results/*.json")[0]
          main = json.load(open(main_file))
          agents = json.load(open(glob.glob("agents/results/*.json")[0]))
          # The generated fixture is committed again in each job, so only a pinned repository's commits can match.
          same_commit = agents["commit"] == main["commit"] or "${{ matrix.repo }}" == "fixture"
          if agents["fuseBuild"] != main["fuseBuild"] or not same_commit:
              raise SystemExit("the two latency parts measured different builds or commits")
          main["part"] = "all"
          main["multiAgent"] = agents["multiAgent"]
          os.makedirs("out/results")
          with open(os.path.join("out/results", os.path.basename(main_file)), "w") as f:
              json.dump(main, f, indent=2)
          shutil.copytree("main/managed", "out/managed")
          shutil.copy("main/runner.txt", "out/runner.txt")
          shutil.copy("agents/runner.txt", "out/runner-agents.txt")
      - uses: actions/upload-artifact@v7
        with:
          name: evals-${{ matrix.repo }}-latency
          path: out/
          if-no-files-found: error

  suite:
    name: ${{ matrix.suite }} on ${{ matrix.repo }}
    needs: [plan, build]
    if: needs.plan.outputs.measure != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.measure) }}
    uses: ./.github/workflows/evals-suite.yml
    with:
      suite: ${{ matrix.suite }}
      repo: ${{ matrix.repo }}
      shards: ${{ matrix.shards }}
      shard-list: ${{ matrix.shard_list }}
      fresh-truth: ${{ inputs.fresh-truth == true }}
