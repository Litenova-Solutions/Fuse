name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # GitHub release
  id-token: write # NuGet Trusted Publishing (OIDC)

jobs:
  package:
    name: Package
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the codebase version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Directory.Build.props version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Check every package is there
        shell: bash
        run: |
          for id in Fuse Fuse.any Fuse.win-x64 Fuse.linux-x64 Fuse.linux-arm64 Fuse.osx-arm64 Fuse.linux-musl-x64 Fuse.linux-musl-arm64; do
            [ -f "artifacts/$id.$VERSION.nupkg" ] || { echo "missing artifacts/$id.$VERSION.nupkg"; exit 1; }
          done

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet tool install resolves the RID packages the pointer package Fuse lists, so they go first.
      - name: Push to NuGet
        shell: bash
        run: |
          for package in artifacts/Fuse.*.nupkg; do
            [ "$package" = "artifacts/Fuse.$VERSION.nupkg" ] && continue
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "artifacts/Fuse.$VERSION.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg --title "Fuse ${VERSION}" --notes-file release-notes.md
