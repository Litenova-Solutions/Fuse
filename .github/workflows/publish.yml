name: Publish

# Publishes a release. Pushing a vX.Y.Z tag packs the tool, pushes the packages to NuGet and creates the GitHub
# release. Starting the workflow by hand with the tag of an existing release pushes that release's packages to NuGet
# again, for a push that nuget.org refused, without packing anything or touching the release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release whose packages to push to NuGet again, such as v5.2.0.
        required: true

permissions:
  contents: write # GitHub release
  id-token: write # NuGet Trusted Publishing (OIDC)

jobs:
  package:
    name: Package
    if: github.event_name == 'push'
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    # A run started by hand has no package job and pushes the release's own packages.
    if: always() && (needs.package.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the codebase version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Directory.Build.props version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        shell: bash
        run: |
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi

      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Download the release's packages
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*.nupkg' --dir artifacts

      - name: Check every package is there
        shell: bash
        run: |
          for id in Fuse Fuse.any Fuse.win-x64 Fuse.linux-x64 Fuse.linux-arm64 Fuse.osx-arm64 Fuse.linux-musl-x64 Fuse.linux-musl-arm64; do
            [ -f "artifacts/$id.$VERSION.nupkg" ] || { echo "missing artifacts/$id.$VERSION.nupkg"; exit 1; }
          done

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet tool install resolves the RID packages the pointer package Fuse lists, so they go first. A version
      # nuget.org already serves is skipped; any other refusal fails the run with nuget.org's own message.
      # --skip-duplicate is not used: nuget.org also answers 409 for reasons other than an existing version, such as a
      # reserved package ID, and --skip-duplicate reports every 409 as "already exists" and passes.
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          push() {
            local package=$1 name id
            name=$(basename "$package" ".$VERSION.nupkg")
            id=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            if curl -sfI "https://api.nuget.org/v3-flatcontainer/$id/$VERSION/$id.$VERSION.nupkg" > /dev/null; then
              echo "$name $VERSION is already on nuget.org; skipped"
              return
            fi
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          }
          for package in artifacts/Fuse.*.nupkg; do
            [ "$package" = "artifacts/Fuse.$VERSION.nupkg" ] && continue
            push "$package"
          done
          push "artifacts/Fuse.$VERSION.nupkg"

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" artifacts/*.nupkg --title "Fuse ${VERSION}" --notes-file release-notes.md
