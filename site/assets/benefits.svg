<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 962" width="800" height="962" role="img" aria-labelledby="t d">
<title id="t">Fuse compared with dotnet build and dotnet test (fuse.codes)</title>
<desc id="d">Fuse, a faster .NET build and test loop for AI coding agents (fuse.codes, github.com/Litenova-Solutions/Fuse). Check an edit, fuse check against dotnet build. FluentValidation (4 projects): 0.15 seconds with Fuse, 1.66 seconds with dotnet, 11.2x faster at the median; Fuse 0.07 to 7.90 s, mean 0.53 s, P95 1.06 s; dotnet 1.10 to 8.05 s, mean 2.24 s, P95 5.37 s; NodaTime (15 projects): 0.70 seconds with Fuse, 5.55 seconds with dotnet, 8.0x faster at the median; Fuse 0.08 to 17.4 s, mean 1.96 s, P95 10.1 s; dotnet 2.22 to 13.0 s, mean 6.13 s, P95 12.0 s; Jellyfin (40 projects): 0.83 seconds with Fuse, 23.0 seconds with dotnet, 27.7x faster at the median; Fuse 0.16 to 68.9 s, mean 6.68 s, P95 35.2 s; dotnet 3.73 to 93.1 s, mean 29.1 s, P95 85.1 s; Polly (15 projects): 2.58 seconds with Fuse, 28.7 seconds with dotnet, 11.1x faster at the median; Fuse 0.61 to 49.7 s, mean 6.89 s, P95 28.4 s; dotnet 4.25 to 116.4 s, mean 42.1 s, P95 114.4 s. Run the affected tests, fuse test against dotnet test. FluentValidation (2,664 tests): 9.66 seconds with Fuse, 11.9 seconds with dotnet, 1.2x faster at the median; Fuse 7.93 to 34.1 s, mean 13.8 s, P95 34.1 s; dotnet 11.3 to 18.3 s, mean 13.1 s, P95 18.3 s; NodaTime (42,736 tests): 61.5 seconds with Fuse, 41.7 seconds with dotnet, 1.5x slower at the median; Fuse 0.06 to 83.8 s, mean 55.7 s, P95 83.8 s; dotnet 32.6 to 68.1 s, mean 45.2 s, P95 68.1 s; Jellyfin (2,535 tests): 101.6 seconds with Fuse, 166.2 seconds with dotnet, 1.6x faster at the median; Fuse 4.64 to 144.5 s, mean 100.4 s, P95 144.5 s; dotnet 132.5 to 177.1 s, mean 164.0 s, P95 177.1 s; Polly (12,329 tests): 33.1 seconds with Fuse, 95.5 seconds with dotnet, 2.9x faster at the median; Fuse 0.05 to 109.5 s, mean 37.0 s, P95 109.5 s; dotnet 86.3 to 115.6 s, mean 99.7 s, P95 115.6 s. Median times over the eval cases, each with the range from the fastest to the slowest case, the mean and P95, on GitHub Actions windows-latest runners.</desc>
<style>
