<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 962" width="800" height="962" role="img" aria-labelledby="t d">
<title id="t">Fuse compared with dotnet build and dotnet test (fuse.codes)</title>
<desc id="d">Fuse, a faster .NET build and test loop for AI coding agents (fuse.codes, github.com/Litenova-Solutions/Fuse). Check an edit, fuse check against dotnet build. FluentValidation (4 projects): 0.19 seconds with Fuse, 2.38 seconds with dotnet, 12.7x faster at the median; Fuse 0.08 to 13.3 s, mean 0.88 s, P95 1.98 s; dotnet 1.57 to 10.8 s, mean 3.02 s, P95 6.25 s; NodaTime (15 projects): 0.60 seconds with Fuse, 4.20 seconds with dotnet, 7.0x faster at the median; Fuse 0.05 to 18.2 s, mean 1.99 s, P95 10.8 s; dotnet 2.08 to 15.5 s, mean 5.88 s, P95 14.7 s; Jellyfin (40 projects): 0.47 seconds with Fuse, 20.4 seconds with dotnet, 43.7x faster at the median; Fuse 0.07 to 34.8 s, mean 3.23 s, P95 19.5 s; dotnet 3.90 to 94.2 s, mean 27.2 s, P95 75.5 s; Community Toolkit (26 projects): 0.51 seconds with Fuse, 17.4 seconds with dotnet, 33.8x faster at the median; Fuse 0.14 to 52.2 s, mean 4.61 s, P95 13.6 s; dotnet 8.58 to 115.0 s, mean 27.8 s, P95 88.3 s. Run the affected tests, fuse test against dotnet test. FluentValidation (2,664 tests): 8.31 seconds with Fuse, 8.87 seconds with dotnet, 1.1x faster at the median; Fuse 7.76 to 24.5 s, mean 11.1 s, P95 24.5 s; dotnet 8.42 to 12.7 s, mean 9.57 s, P95 12.7 s; NodaTime (42,700 tests): 38.8 seconds with Fuse, 60.4 seconds with dotnet, 1.6x faster at the median; Fuse 0.04 to 58.1 s, mean 35.6 s, P95 58.1 s; dotnet 42.8 to 70.2 s, mean 58.1 s, P95 70.2 s; Jellyfin (2,535 tests): 99.4 seconds with Fuse, 163.5 seconds with dotnet, 1.6x faster at the median; Fuse 4.39 to 130.6 s, mean 95.1 s, P95 130.6 s; dotnet 144.5 to 175.9 s, mean 162.8 s, P95 175.9 s; Community Toolkit (12,449 tests): 156.0 seconds with Fuse, 758.6 seconds with dotnet, 4.9x faster at the median; Fuse 8.66 to 180.3 s, mean 118.9 s, P95 180.3 s; dotnet 687.1 to 822.3 s, mean 759.1 s, P95 822.3 s. Median times over the eval cases, each with the range from the fastest to the slowest case, the mean and P95, on GitHub Actions windows-latest runners.</desc>
