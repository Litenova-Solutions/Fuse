<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 708" width="800" height="708" role="img" aria-labelledby="t d">
<title id="t">Fuse compared with dotnet build and dotnet test</title>
<desc id="d">Check an edit, fuse check against dotnet build. NodaTime (15 projects): 0.41 seconds with Fuse, 2.96 seconds with dotnet, 7.2x faster; Jellyfin (40 projects): 1.04 seconds with Fuse, 12.4 seconds with dotnet, 12.0x faster; Community Toolkit (26 projects): 0.57 seconds with Fuse, 12.8 seconds with dotnet, 22.6x faster. Run the affected tests, fuse test against dotnet test. NodaTime (42,700 tests): 31.8 seconds with Fuse, 46.0 seconds with dotnet, 1.4x faster; Jellyfin (2,535 tests): 163.2 seconds with Fuse, 269.7 seconds with dotnet, 1.7x faster; Community Toolkit (12,449 tests): 200.1 seconds with Fuse, 880.1 seconds with dotnet, 4.4x faster. Median times over the eval cases on GitHub Actions windows-latest runners.</desc>
<style>
  .bg { fill: #fcfcfb; stroke: #e4e3de; }
  .rule { stroke: #e4e3de; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .panel { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { font-size: 14px; fill: #5b5a55; }
  .sub .mono { font-size: 13px; }
  .repo { font-size: 15px; font-weight: 600; }
  .meta, .note { font-size: 13px; fill: #5b5a55; }
  .note { font-size: 12.5px; }
  .cmd, .t { font-size: 13.5px; fill: #5b5a55; }
  .t { font-variant-numeric: tabular-nums; }
  .fuse-text { fill: #0b0b0b; font-weight: 600; }
  .speed { font-size: 13px; fill: #5b5a55; }
  .speed tspan { fill: #0b0b0b; font-weight: 600; }
  .track { fill: #ebeae6; }
  .fill-slow { fill: #b4b3ad; }
  .fill-fuse { fill: #6d4aff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #34332f; }
    .rule { stroke: #34332f; }
    text, .fuse-text, .speed tspan { fill: #f4f4f0; }
    .sub, .meta, .note, .cmd, .t, .speed { fill: #b9b8af; }
    .fuse-text { fill: #f4f4f0; }
    .track { fill: #2e2d2a; }
    .fill-slow { fill: #6f6e68; }
    .fill-fuse { fill: #9b85ff; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="707" rx="12"/>
<text class="panel" x="36" y="62">Check an edit</text>
<text class="sub" x="36" y="86"><tspan class="mono">fuse check</tspan> vs <tspan class="mono">dotnet build</tspan></text>
<text class="repo" x="36" y="120">NodaTime</text>
<text class="meta" x="372" y="120" text-anchor="end">15 projects</text>
<text class="cmd mono fuse-text" x="36" y="149.5">fuse check</text>
<path class="track" d="M144,140h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,140h18.24a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-18.24z"/>
<text class="t fuse-text" x="372" y="149.5" text-anchor="end">0.41 s</text>
<text class="cmd mono" x="36" y="171.5">dotnet build</text>
<path class="fill-slow" d="M144,162h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="171.5" text-anchor="end">2.96 s</text>
<text class="speed" x="36" y="197"><tspan>7.2x</tspan> faster</text>
<text class="repo" x="428" y="120">Jellyfin</text>
<text class="meta" x="764" y="120" text-anchor="end">40 projects</text>
<text class="cmd mono fuse-text" x="428" y="149.5">fuse check</text>
<path class="track" d="M536,140h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,140h9.37a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-9.37z"/>
<text class="t fuse-text" x="764" y="149.5" text-anchor="end">1.04 s</text>
<text class="cmd mono" x="428" y="171.5">dotnet build</text>
<path class="fill-slow" d="M536,162h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="171.5" text-anchor="end">12.4 s</text>
<text class="speed" x="428" y="197"><tspan>12.0x</tspan> faster</text>
<text class="repo" x="232" y="230">Community Toolkit</text>
<text class="meta" x="568" y="230" text-anchor="end">26 projects</text>
<text class="cmd mono fuse-text" x="232" y="259.5">fuse check</text>
<path class="track" d="M340,250h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M340,250h3.55a3.55,3.55 0 0 1 3.55,3.55v2.91a3.55,3.55 0 0 1 -3.55,3.55h-3.55z"/>
<text class="t fuse-text" x="568" y="259.5" text-anchor="end">0.57 s</text>
<text class="cmd mono" x="232" y="281.5">dotnet build</text>
<path class="fill-slow" d="M340,272h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="568" y="281.5" text-anchor="end">12.8 s</text>
<text class="speed" x="232" y="307"><tspan>22.6x</tspan> faster</text>
<line class="rule" x1="36" y1="340" x2="764" y2="340"/>
<text class="panel" x="36" y="388">Run the affected tests</text>
<text class="sub" x="36" y="412"><tspan class="mono">fuse test</tspan> vs <tspan class="mono">dotnet test</tspan></text>
<text class="repo" x="36" y="446">NodaTime</text>
<text class="meta" x="372" y="446" text-anchor="end">42,700 tests</text>
<text class="cmd mono fuse-text" x="36" y="475.5">fuse test</text>
<path class="track" d="M144,466h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,466h106.82a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-106.82z"/>
<text class="t fuse-text" x="372" y="475.5" text-anchor="end">31.8 s</text>
<text class="cmd mono" x="36" y="497.5">dotnet test</text>
<path class="fill-slow" d="M144,488h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="497.5" text-anchor="end">46.0 s</text>
<text class="speed" x="36" y="523"><tspan>1.4x</tspan> faster</text>
<text class="repo" x="428" y="446">Jellyfin</text>
<text class="meta" x="764" y="446" text-anchor="end">2,535 tests</text>
<text class="cmd mono fuse-text" x="428" y="475.5">fuse test</text>
<path class="track" d="M536,466h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,466h92.8a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-92.8z"/>
<text class="t fuse-text" x="764" y="475.5" text-anchor="end">163.2 s</text>
<text class="cmd mono" x="428" y="497.5">dotnet test</text>
<path class="fill-slow" d="M536,488h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="497.5" text-anchor="end">269.7 s</text>
<text class="speed" x="428" y="523"><tspan>1.7x</tspan> faster</text>
<text class="repo" x="232" y="556">Community Toolkit</text>
<text class="meta" x="568" y="556" text-anchor="end">12,449 tests</text>
<text class="cmd mono fuse-text" x="232" y="585.5">fuse test</text>
<path class="track" d="M340,576h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M340,576h32.38a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-32.38z"/>
<text class="t fuse-text" x="568" y="585.5" text-anchor="end">200.1 s</text>
<text class="cmd mono" x="232" y="607.5">dotnet test</text>
<path class="fill-slow" d="M340,598h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="568" y="607.5" text-anchor="end">880.1 s</text>
<text class="speed" x="232" y="633"><tspan>4.4x</tspan> faster</text>
<text class="note" x="36" y="682">Each dotnet bar is 100 percent, and each Fuse bar is Fuse's time as a share of it. Medians over the eval cases, on GitHub Actions windows-latest runners.</text>
</svg>
