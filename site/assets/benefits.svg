<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 962" width="800" height="962" role="img" aria-labelledby="t d">
<title id="t">Fuse compared with dotnet build and dotnet test (fuse.codes)</title>
<desc id="d">Fuse, a faster .NET build and test loop for AI coding agents (fuse.codes, github.com/Litenova-Solutions/Fuse). Check an edit, fuse check against dotnet build. FluentValidation (4 projects): 0.24 seconds with Fuse, 2.30 seconds with dotnet, 9.8x faster at the median; Fuse 0.09 to 14.2 s, mean 0.94 s, P95 2.03 s; dotnet 1.55 to 9.41 s, mean 3.00 s, P95 8.03 s; NodaTime (15 projects): 0.47 seconds with Fuse, 3.28 seconds with dotnet, 7.0x faster at the median; Fuse 0.04 to 15.1 s, mean 1.67 s, P95 8.78 s; dotnet 2.01 to 9.77 s, mean 4.21 s, P95 8.20 s; Jellyfin (40 projects): 0.69 seconds with Fuse, 11.1 seconds with dotnet, 16.1x faster at the median; Fuse 0.12 to 64.6 s, mean 5.91 s, P95 31.2 s; dotnet 1.36 to 64.4 s, mean 17.8 s, P95 59.8 s; Community Toolkit (26 projects): 0.48 seconds with Fuse, 15.0 seconds with dotnet, 31.0x faster at the median; Fuse 0.13 to 48.9 s, mean 4.24 s, P95 13.0 s; dotnet 6.94 to 68.2 s, mean 22.5 s, P95 53.4 s. Run the affected tests, fuse test against dotnet test. FluentValidation (2,664 tests): 7.70 seconds with Fuse, 15.0 seconds with dotnet, 1.9x faster at the median; Fuse 7.36 to 28.2 s, mean 10.4 s, P95 28.2 s; dotnet 11.7 to 20.9 s, mean 14.8 s, P95 20.9 s; NodaTime (42,700 tests): 47.6 seconds with Fuse, 62.2 seconds with dotnet, 1.3x faster at the median; Fuse 0.05 to 70.4 s, mean 43.8 s, P95 70.4 s; dotnet 58.1 to 70.3 s, mean 62.9 s, P95 70.3 s; Jellyfin (2,535 tests): 111.0 seconds with Fuse, 143.2 seconds with dotnet, 1.3x faster at the median; Fuse 7.17 to 144.3 s, mean 107.0 s, P95 144.3 s; dotnet 123.6 to 189.0 s, mean 150.5 s, P95 189.0 s; Community Toolkit (12,449 tests): 198.0 seconds with Fuse, 723.9 seconds with dotnet, 3.7x faster at the median; Fuse 14.6 to 224.5 s, mean 148.3 s, P95 224.5 s; dotnet 551.7 to 782.1 s, mean 701.4 s, P95 782.1 s. Median times over the eval cases, each with the range from the fastest to the slowest case, the mean and P95, on GitHub Actions windows-latest runners.</desc>
