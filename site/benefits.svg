<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" role="img" aria-labelledby="t d">
<title id="t">Fuse time as a share of the dotnet command it replaces</title>
<desc id="d">check, Small solution, 5 projects: 0.18 s with Fuse against 1.14 s with dotnet; tests, Small solution, 5 projects: 1.27 s with Fuse against 4.17 s with dotnet; check, NodaTime, 15 projects: 0.63 s with Fuse against 1.45 s with dotnet; tests, NodaTime, 42,700 tests: 32.0 s with Fuse against 44.4 s with dotnet; check, Jellyfin, 40 projects: 0.70 s with Fuse against 4.26 s with dotnet; tests, Jellyfin, 2,535 tests: 165.3 s with Fuse against 226.6 s with dotnet; check, Community Toolkit, 26 projects: 0.45 s with Fuse against 4.48 s with dotnet; tests, Community Toolkit, 12,449 tests: 65.1 s with Fuse against 428.5 s with dotnet</desc>
<style>
  .bg { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font: 600 17px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .sub, .axis, .val { fill: #52514e; font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .group { fill: #0b0b0b; font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .label { fill: #0b0b0b; font: 14px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .val { font-variant-numeric: tabular-nums; }
  .val-in { fill: #ffffff; font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e2e1dc; stroke-width: 1; }
  .ref { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .bar { fill: #6d4aff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .group, .label { fill: #ffffff; }
    .sub, .axis, .val { fill: #c3c2b7; }
    .grid { stroke: #34332f; }
    .ref { stroke: #8f8e87; }
    .bar { fill: #9b85ff; }
  }
</style>
<rect class="bg" width="760" height="458" rx="10"/>
<text class="title" x="20" y="34">Time until the agent knows</text>
<text class="sub" x="20" y="56">Fuse's median time as a share of the dotnet command it replaces. Shorter is better.</text>
