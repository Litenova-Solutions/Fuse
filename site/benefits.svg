<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 708" width="800" height="708" role="img" aria-labelledby="t d">
<title id="t">Fuse compared with dotnet build and dotnet test</title>
<desc id="d">Check an edit, fuse check against dotnet build. Small solution (5 projects): 0.18 seconds with Fuse, 1.14 seconds with dotnet, 6.2x faster; NodaTime (15 projects): 0.58 seconds with Fuse, 1.71 seconds with dotnet, 2.9x faster; Jellyfin (40 projects): 0.60 seconds with Fuse, 4.20 seconds with dotnet, 7.0x faster; Community Toolkit (26 projects): 0.87 seconds with Fuse, 6.45 seconds with dotnet, 7.4x faster. Run the affected tests, fuse test against dotnet test. Small solution (22 tests): 1.23 seconds with Fuse, 4.00 seconds with dotnet, 3.2x faster; NodaTime (42,700 tests): 23.4 seconds with Fuse, 36.3 seconds with dotnet, 1.6x faster; Jellyfin (2,535 tests): 150.0 seconds with Fuse, 208.3 seconds with dotnet, 1.4x faster; Community Toolkit (12,449 tests): 77.6 seconds with Fuse, 444.6 seconds with dotnet, 5.7x faster. Median times over the eval cases on one Windows machine.</desc>
<style>
  .bg { fill: #fcfcfb; stroke: #e4e3de; }
  .rule { stroke: #e4e3de; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .panel { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { font-size: 14px; fill: #5b5a55; }
  .sub .mono { font-size: 13px; }
  .repo { font-size: 15px; font-weight: 600; }
  .meta, .note { font-size: 13px; fill: #5b5a55; }
  .note { font-size: 12.5px; }
  .cmd, .t { font-size: 13.5px; fill: #5b5a55; }
  .t { font-variant-numeric: tabular-nums; }
  .fuse-text { fill: #0b0b0b; font-weight: 600; }
  .speed { font-size: 13px; fill: #5b5a55; }
  .speed tspan { fill: #0b0b0b; font-weight: 600; }
  .track { fill: #ebeae6; }
  .fill-slow { fill: #b4b3ad; }
  .fill-fuse { fill: #6d4aff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #34332f; }
    .rule { stroke: #34332f; }
    text, .fuse-text, .speed tspan { fill: #f4f4f0; }
    .sub, .meta, .note, .cmd, .t, .speed { fill: #b9b8af; }
    .fuse-text { fill: #f4f4f0; }
    .track { fill: #2e2d2a; }
    .fill-slow { fill: #6f6e68; }
    .fill-fuse { fill: #9b85ff; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="707" rx="12"/>
<text class="panel" x="36" y="62">Check an edit</text>
<text class="sub" x="36" y="86"><tspan class="mono">fuse check</tspan> vs <tspan class="mono">dotnet build</tspan></text>
<text class="repo" x="36" y="120">Small solution</text>
<text class="meta" x="372" y="120" text-anchor="end">5 projects</text>
<text class="cmd mono fuse-text" x="36" y="149.5">fuse check</text>
<path class="track" d="M144,140h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,140h21.81a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-21.81z"/>
<text class="t fuse-text" x="372" y="149.5" text-anchor="end">0.18 s</text>
<text class="cmd mono" x="36" y="171.5">dotnet build</text>
<path class="fill-slow" d="M144,162h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="171.5" text-anchor="end">1.14 s</text>
<text class="speed" x="36" y="197"><tspan>6.2x</tspan> faster</text>
<text class="repo" x="428" y="120">NodaTime</text>
<text class="meta" x="764" y="120" text-anchor="end">15 projects</text>
<text class="cmd mono fuse-text" x="428" y="149.5">fuse check</text>
<path class="track" d="M536,140h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,140h50.55a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-50.55z"/>
<text class="t fuse-text" x="764" y="149.5" text-anchor="end">0.58 s</text>
<text class="cmd mono" x="428" y="171.5">dotnet build</text>
<path class="fill-slow" d="M536,162h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="171.5" text-anchor="end">1.71 s</text>
<text class="speed" x="428" y="197"><tspan>2.9x</tspan> faster</text>
<text class="repo" x="36" y="230">Jellyfin</text>
<text class="meta" x="372" y="230" text-anchor="end">40 projects</text>
<text class="cmd mono fuse-text" x="36" y="259.5">fuse check</text>
<path class="track" d="M144,250h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,250h19a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-19z"/>
<text class="t fuse-text" x="372" y="259.5" text-anchor="end">0.60 s</text>
<text class="cmd mono" x="36" y="281.5">dotnet build</text>
<path class="fill-slow" d="M144,272h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="281.5" text-anchor="end">4.20 s</text>
<text class="speed" x="36" y="307"><tspan>7.0x</tspan> faster</text>
<text class="repo" x="428" y="230">Community Toolkit</text>
<text class="meta" x="764" y="230" text-anchor="end">26 projects</text>
<text class="cmd mono fuse-text" x="428" y="259.5">fuse check</text>
<path class="track" d="M536,250h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,250h17.66a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-17.66z"/>
<text class="t fuse-text" x="764" y="259.5" text-anchor="end">0.87 s</text>
<text class="cmd mono" x="428" y="281.5">dotnet build</text>
<path class="fill-slow" d="M536,272h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="281.5" text-anchor="end">6.45 s</text>
<text class="speed" x="428" y="307"><tspan>7.4x</tspan> faster</text>
<line class="rule" x1="36" y1="340" x2="764" y2="340"/>
<text class="panel" x="36" y="388">Run the affected tests</text>
<text class="sub" x="36" y="412"><tspan class="mono">fuse test</tspan> vs <tspan class="mono">dotnet test</tspan></text>
<text class="repo" x="36" y="446">Small solution</text>
<text class="meta" x="372" y="446" text-anchor="end">22 tests</text>
<text class="cmd mono fuse-text" x="36" y="475.5">fuse test</text>
<path class="track" d="M144,466h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,466h45.3a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-45.3z"/>
<text class="t fuse-text" x="372" y="475.5" text-anchor="end">1.23 s</text>
<text class="cmd mono" x="36" y="497.5">dotnet test</text>
<path class="fill-slow" d="M144,488h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="497.5" text-anchor="end">4.00 s</text>
<text class="speed" x="36" y="523"><tspan>3.2x</tspan> faster</text>
<text class="repo" x="428" y="446">NodaTime</text>
<text class="meta" x="764" y="446" text-anchor="end">42,700 tests</text>
<text class="cmd mono fuse-text" x="428" y="475.5">fuse test</text>
<path class="track" d="M536,466h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,466h99.12a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-99.12z"/>
<text class="t fuse-text" x="764" y="475.5" text-anchor="end">23.4 s</text>
<text class="cmd mono" x="428" y="497.5">dotnet test</text>
<path class="fill-slow" d="M536,488h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="497.5" text-anchor="end">36.3 s</text>
<text class="speed" x="428" y="523"><tspan>1.6x</tspan> faster</text>
<text class="repo" x="36" y="556">Jellyfin</text>
<text class="meta" x="372" y="556" text-anchor="end">2,535 tests</text>
<text class="cmd mono fuse-text" x="36" y="585.5">fuse test</text>
<path class="track" d="M144,576h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M144,576h111.26a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-111.26z"/>
<text class="t fuse-text" x="372" y="585.5" text-anchor="end">150.0 s</text>
<text class="cmd mono" x="36" y="607.5">dotnet test</text>
<path class="fill-slow" d="M144,598h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="372" y="607.5" text-anchor="end">208.3 s</text>
<text class="speed" x="36" y="633"><tspan>1.4x</tspan> faster</text>
<text class="repo" x="428" y="556">Community Toolkit</text>
<text class="meta" x="764" y="556" text-anchor="end">12,449 tests</text>
<text class="cmd mono fuse-text" x="428" y="585.5">fuse test</text>
<path class="track" d="M536,576h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<path class="fill-fuse" d="M536,576h23.94a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-23.94z"/>
<text class="t fuse-text" x="764" y="585.5" text-anchor="end">77.6 s</text>
<text class="cmd mono" x="428" y="607.5">dotnet test</text>
<path class="fill-slow" d="M536,598h156a4,4 0 0 1 4,4v2a4,4 0 0 1 -4,4h-156z"/>
<text class="t" x="764" y="607.5" text-anchor="end">444.6 s</text>
<text class="speed" x="428" y="633"><tspan>5.7x</tspan> faster</text>
<text class="note" x="36" y="682">Each dotnet bar is 100 percent, and each Fuse bar is Fuse's time as a share of it. Medians over the eval cases, one Windows machine.</text>
</svg>
